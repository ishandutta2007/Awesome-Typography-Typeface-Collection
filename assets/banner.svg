<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" fill="none" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><radialGradient id="glowViolet" cx="25%" cy="30%" r="55%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".28"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><radialGradient id="glowCyan" cx="78%" cy="65%" r="50%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".24"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><radialGradient id="glowPink" cx="50%" cy="85%" r="45%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".18"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></radialGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="35%" stop-color="#f1f5f9"/><stop offset="70%" stop-color="#c084fc"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="cardGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatSlow1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes floatSlow2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-1.5deg)}}@keyframes floatSlow3{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes pulseAura{0%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}@keyframes specimenCycle{0%{font-weight:200;letter-spacing:4px}50%{font-weight:800;letter-spacing:8px}}.floating-pill-1{animation:floatSlow1 7s ease-in-out infinite}.floating-pill-2{animation:floatSlow2 8.5s ease-in-out infinite}.floating-pill-3{animation:floatSlow3 6.2s ease-in-out infinite}.aura-glow{animation:pulseAura 9s ease-in-out infinite alternate;transform-origin:center}.specimen-anim{animation:specimenCycle 10s ease-in-out infinite}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" rx="16"/><g class="aura-glow"><circle cx="300" cy="130" r="280" fill="url(#glowViolet)"/><circle cx="940" cy="270" r="260" fill="url(#glowCyan)"/><circle cx="600" cy="360" r="240" fill="url(#glowPink)"/></g><g fill="#fff" fill-opacity=".035" font-family="Georgia, serif" font-weight="bold" user-select="none"><text x="40" y="240" font-size="280">Aa</text><text x="490" y="210" font-size="240">&amp;</text><text x="890" y="260" font-size="300">Q</text><text x="1050" y="380" font-size="200">g</text></g><g stroke="#334155" stroke-dasharray="3 6" stroke-opacity=".35"><line x1="80" x2="1120" y1="120" y2="120"/><line x1="80" x2="1120" y1="230" y2="230"/><line x1="80" x2="1120" y1="305" y2="305"/></g><g fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" letter-spacing="1.5"><text x="82" y="115">ASCENDER / 800</text><text x="82" y="225">CAP-HEIGHT / 700</text><text x="82" y="300">BASELINE / 0</text></g><g class="floating-pill-1" transform="translate(850, 42)"><rect width="145" height="34" fill="url(#cardGrad1)" stroke="#8b5cf6" stroke-opacity=".4" stroke-width="1.2" rx="17"/><circle cx="20" cy="17" r="4" fill="#a855f7"/><text x="34" y="22" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" letter-spacing=".5">SIL OFL 1.1</text></g><g class="floating-pill-2" transform="translate(1015, 42