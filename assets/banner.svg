<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <radialGradient id="glowViolet" cx="25%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="78%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPink" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes specimenCycle {
        0%, 100% { font-weight: 200; letter-spacing: 4px; }
        50% { font-weight: 800; letter-spacing: 8px; }
      }

      .floating-pill-1 { animation: floatSlow1 7s ease-in-out infinite; }
      .floating-pill-2 { animation: floatSlow2 8.5s ease-in-out infinite; }
      .floating-pill-3 { animation: floatSlow3 6.2s ease-in-out infinite; }
      .aura-glow { animation: pulseAura 9s ease-in-out infinite alternate; transform-origin: center; }
      .specimen-anim { animation: specimenCycle 10s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Glowing Dynamic Auras (Layer 1 - Background) -->
  <g class="aura-glow">
    <circle cx="300" cy="130" r="280" fill="url(#glowViolet)"/>
    <circle cx="940" cy="270" r="260" fill="url(#glowCyan)"/>
    <circle cx="600" cy="360" r="240" fill="url(#glowPink)"/>
  </g>

  <!-- Typographic Watermark Glyphs in Background (Layer 2) -->
  <g font-family="Georgia, serif" fill="#ffffff" fill-opacity="0.035" font-weight="bold" user-select="none">
    <text x="40" y="240" font-size="280">Aa</text>
    <text x="490" y="210" font-size="240">&amp;</text>
    <text x="890" y="260" font-size="300">Q</text>
    <text x="1050" y="380" font-size="200">g</text>
  </g>

  <!-- Grid Accent Lines & Measurement Rulers (Layer 3) -->
  <g stroke="#334155" stroke-opacity="0.35" stroke-dasharray="3 6">
    <line x1="80" y1="120" x2="1120" y2="120"/>
    <line x1="80" y1="230" x2="1120" y2="230"/>
    <line x1="80" y1="305" x2="1120" y2="305"/>
  </g>

  <!-- Baseline & Cap Height Typographic Guides -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" letter-spacing="1.5">
    <text x="82" y="115">ASCENDER / 800</text>
    <text x="82" y="225">CAP-HEIGHT / 700</text>
    <text x="82" y="300">BASELINE / 0</text>
  </g>

  <!-- Animated Floating Feature Pills (Layer 4 - Placed carefully so they do not overlap title) -->
  <!-- Top Left Pill -->
  <g class="floating-pill-1" transform="translate(850, 42)">
    <rect width="145" height="34" rx="17" fill="url(#cardGrad1)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="4" fill="#a855f7"/>
    <text x="34" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">SIL OFL 1.1</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-pill-2" transform="translate(1015, 42)">
    <rect width="130" height="34" rx="17" fill="url(#cardGrad1)" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4" fill="#22d3ee"/>
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">WOFF2 / TTF</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-pill-3" transform="translate(60, 350)">
    <rect width="170" height="36" rx="18" fill="url(#cardGrad1)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="20" cy="18" r="4" fill="#f43f5e"/>
    <text x="34" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" letter-spacing="0.5">⚡ Variable Font Axes</text>
  </g>

  <!-- Bottom Center Pill -->
  <g class="floating-pill-1" transform="translate(245, 350)">
    <rect width="175" height="36" rx="18" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="20" cy="18" r="4" fill="#60a5fa"/>
    <text x="34" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" letter-spacing="0.5">📦 Self-Hosted @npm</text>
  </g>

  <!-- Bottom Right Pill 1 -->
  <g class="floating-pill-2" transform="translate(980, 350)">
    <rect width="165" height="36" rx="18" fill="url(#cardGrad1)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="20" cy="18" r="4" fill="#34d399"/>
    <text x="34" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9" letter-spacing="0.5">✦ UI &amp; Code Ligatures</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, Specimen Preview (Layer 5 - strictly in foreground) -->
  <!-- Category Tag -->
  <g transform="translate(80, 48)">
    <rect width="210" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.16" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1"/>
    <text x="14" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#c084fc" letter-spacing="1.2">✦ AWESOME COLLECTION</text>
  </g>

  <!-- Main Hero Title -->
  <text x="80" y="142" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1">
    TYPOGRAPHY &amp; TYPEFACES
  </text>

  <!-- Subtitle -->
  <text x="82" y="184" font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
    Curated Open-Source Fonts • Top Type Foundries • Variable Axes &amp; Self-Hosted Distribution
  </text>

  <!-- Dynamic Font Specimen Preview Bar -->
  <g transform="translate(82, 222)">
    <rect width="1038" height="66" rx="12" fill="#030712" fill-opacity="0.65" stroke="#334155" stroke-width="1"/>
    
    <!-- Weight progression demonstration -->
    <text x="24" y="40" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="14" fill="#e2e8f0">
      <tspan font-weight="200" fill="#64748b">Thin 100 </tspan>
      <tspan font-weight="300" fill="#94a3b8">· Light 300 </tspan>
      <tspan font-weight="400" fill="#cbd5e1">· Regular 400 </tspan>
      <tspan font-weight="500" fill="#f1f5f9">· Medium 500 </tspan>
      <tspan font-weight="600" fill="#c084fc">· SemiBold 600 </tspan>
      <tspan font-weight="700" fill="#38bdf8">· Bold 700 </tspan>
      <tspan font-weight="900" fill="#ffffff">· Black 900</tspan>
    </text>

    <!-- Right Side Glyph specimen with dynamic class -->
    <text x="1014" y="42" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#38bdf8" font-style="italic" class="specimen-anim">
      Sphinx of black quartz, judge my vow.
    </text>
  </g>
</svg>
